name: Update stats card

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build stats.svg
        run: python3 .github/scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if the numbers changed
        run: |
          git add stats.svg
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats card"
          git push
