name: Update Spotify card

on:
  schedule:
    - cron: "17 * * * *" # every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/spotify.py
      - .github/workflows/spotify.yml

permissions:
  contents: write

concurrency:
  group: spotify-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: pip install pillow==12.3.0

      - name: Build spotify.svg
        run: python .github/scripts/spotify.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CARD_OUT: ${{ runner.temp }}/card/spotify.svg
          CARD_TIMEZONE: America/New_York

      # Its own one-commit branch, so hourly updates don't pile up commits on main
      - name: Publish to the spotify-card branch
        run: |
          cd "$RUNNER_TEMP/card" 2>/dev/null || { echo "No card built"; exit 0; }
          git init -q -b spotify-card
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update Spotify card"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" spotify-card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
